apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-service:v3
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: payment-system-config
            - secretRef:
                name: payment-system-secret

          ports:
            - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
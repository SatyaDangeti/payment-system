apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: bobby0307/order-service:latest
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: payment-system-config
            - secretRef:
                name: payment-system-secret

          ports:
            - containerPort: 8082

---
apiVersion: v1
kind: Service
metadata:
  name: order-service

spec:
  selector:
    app: order-service

  ports:
    - port: 8082
      targetPort: 8082
name: Payment System CI

on:
  push:
    branches:
      - main
      - saga-implementation

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Order Service
        working-directory: order_service
        run: mvn clean package -DskipTests

      - name: Build Payment Service
        working-directory: payment_service
        run: mvn clean package -DskipTests

      - name: Build Notification Service
        working-directory: notification_service
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Order Service
        uses: docker/build-push-action@v6
        with:
          context: ./order_service
          push: true
          tags: bobby0307/order-service:latest

      - name: Build and push Payment Service
        uses: docker/build-push-action@v6
        with:
          context: ./payment_service
          push: true
          tags: bobby0307/payment-service:latest

      - name: Build and push Notification Service
        uses: docker/build-push-action@v6
        with:
          context: ./notification_service
          push: true
          tags: bobby0307/notification-service:latest